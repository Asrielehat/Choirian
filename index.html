<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choirian</title>
<link rel="stylesheet" href="/style.css">
<script>
(function () {
  var hue = Math.floor(Math.random() * 360);
  var turn = 24 + Math.floor(Math.random() * 48);
  var root = document.documentElement;
  root.dataset.hue = String(hue);
  function h(s, l) { return 'hsl(' + hue + ' ' + s + '% ' + l + '%)'; }
  root.style.setProperty('--room', h(26, 8));
  root.style.setProperty('--paper', h(24, 91));
  root.style.setProperty('--ink', h(30, 12));
  root.style.setProperty('--text', h(20, 94));
  root.style.setProperty('--muted', h(14, 76));
  root.style.setProperty('--line', h(16, 32));
  root.style.setProperty('--table', h(14, 84));
  root.style.setProperty('--mark', 'hsl(' + ((hue + turn) % 360) + ' 62% 58%)');
})();
</script>
</head>
<body>
<section id="home">
  <canvas id="staff" aria-hidden="true"></canvas>
  <h1 id="homeTitle" class="home-title">Choirian</h1>
  <div class="bench">
    <div id="historyDrop">
      <div class="actions">
        <label class="dropface">
          <span class="dropword">新建</span>
          <span class="dropnote">放入 PDF 或照片</span>
          <input id="file" class="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple>
        </label>
        <button type="button" id="libraryToggle" class="rail" aria-pressed="false">
          <span class="dropword">查看已有</span>
          <span class="dropnote">以前识别过的谱</span>
        </button>
      </div>
      <div id="history" class="repertoire" inert></div>
    </div>
  </div>
</section>
<div id="work" hidden>
<header>
  <div class="mast">
    <button type="button" id="back">返回</button>
    <h1 id="pieceName">打开一份扫描谱</h1>
  </div>
  <label class="pick">换一份<input id="fileAgain" class="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple></label>
</header>
<main>
  <section class="score" aria-label="原谱">
    <div class="stand">
      <div id="stage" class="stage">
        <p id="empty" class="empty">这一页还没有谱。</p>
      </div>
      <div class="pager">
        <button type="button" id="prev" disabled>上一页</button>
        <span id="pageLabel">还没有谱</span>
        <button type="button" id="next" disabled>下一页</button>
      </div>
    </div>
  </section>
  <section class="acts" aria-label="识谱">
    <button type="button" id="recognize" class="act" disabled aria-label="识别">
      <span class="act-staff" aria-hidden="true"></span>
      <span class="act-word">识别</span>
      <span class="act-note" id="recognizeNote" aria-hidden="true">读这一份</span>
      <span class="act-rule" aria-hidden="true"></span>
      <progress id="recognizeProgress" hidden aria-label="识别进度"></progress>
    </button>
    <button type="button" id="openMuseScore" class="act" disabled aria-label="用 MuseScore 打开">
      <span class="act-word">MuseScore</span>
      <span class="act-note" id="museNote" aria-hidden="true">先识别，再打开</span>
      <span class="act-rule" aria-hidden="true"></span>
    </button>
    <div class="act-row">
      <label class="act act-small" aria-label="导入改过的谱">
        <span class="act-word">导入</span>
        <span class="act-note" aria-hidden="true">改过的谱</span>
        <input id="importScore" class="file-input" type="file" aria-label="导入改过的谱" accept=".xml,.musicxml,.mxl,application/vnd.recordare.musicxml+xml" disabled>
      </label>
      <button type="button" id="exportScore" class="act act-small" disabled aria-label="下载电子谱">
        <span class="act-word">下载</span>
        <span class="act-note" aria-hidden="true">电子谱</span>
      </button>
    </div>
  </section>
</main>
</div>
<p id="status" role="status"></p>
<script src="/app.js"></script>
</body>
</html>
