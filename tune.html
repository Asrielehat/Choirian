<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微调 · Choirian</title>
<link rel="stylesheet" href="/style.css">
<script>
(function () {
  var hue = Math.floor(Math.random() * 360);
  var turn = 24 + Math.floor(Math.random() * 48);
  var root = document.documentElement;
  function h(s, l) { return 'hsl(' + hue + ' ' + s + '% ' + l + '%)'; }
  root.style.setProperty('--room', h(26, 8));
  root.style.setProperty('--paper', h(24, 91));
  root.style.setProperty('--ink', h(30, 12));
  root.style.setProperty('--text', h(20, 94));
  root.style.setProperty('--muted', h(14, 76));
  root.style.setProperty('--line', h(16, 32));
  root.style.setProperty('--table', h(14, 84));
  root.style.setProperty('--mark', 'hsl(' + ((hue + turn) % 360) + ' 62% 58%)');
})();
</script>
</head>
<body class="tune-app">
<header class="tune-head">
  <div class="titles">
    <p class="brand">Choirian</p>
    <h1 id="pieceName">微调</h1>
  </div>
  <div class="tune-jump">
    <label>小节
      <input id="bar" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="小节号">
    </label>
    <button type="button" id="go" class="quiet">跳转</button>
    <label class="ghost-toggle"><input id="ghosts" type="checkbox" checked>显示其他声部</label>
    <button type="button" id="play" class="quiet" disabled>播放</button>
    <span id="now">0:00</span>
  </div>
</header>
<div class="tune-tools">
  <div class="choice-row" id="voices" role="group" aria-label="声部"></div>
  <div class="choice-row" id="rhythms" role="group" aria-label="节奏"></div>
  <div class="duration-row">
    <label>时值（以四分音符为 1）
      <input id="duration" type="text" inputmode="decimal" placeholder="1.5 或 1/3" autocomplete="off" spellcheck="false">
    </label>
    <span id="readout">先选一个音，或输入时值</span>
    <button type="button" id="apply" class="quiet">用这个时值</button>
    <button type="button" id="remove" class="quiet" disabled>删除</button>
  </div>
</div>
<p id="status" role="status"></p>
<div class="roll">
  <div class="roll-corner"></div>
  <div class="ruler" id="ruler"><div id="rulerInner"></div></div>
  <div class="key-col"><div id="keys"></div></div>
  <div class="time-col" id="timeCol" tabindex="0" aria-label="钢琴卷帘"><div id="lane"></div></div>
</div>
<script src="/tune.js"></script>
</body>
</html>
